name: Feature request
description: Propose a new feature or an improvement
labels: ["type/feature"]
body:
  - type: markdown
    attributes:
      value: |
        The reader did not see your conversation or notes. A reader must understand the text with only this issue. Do not use names that only you know. Do not write "earlier" or "above".
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult now, or what is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How must the feature work?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: If the proposal depends on the current behavior, the output of `git rev-parse --short HEAD` in the checkout that you read. Leave this field empty for a new idea that does not depend on a checkout.
      placeholder: "For example, afbe95f"
  - type: textarea
    id: context
    attributes:
      label: More information
      description: Reference images, similar examples, or other solutions that you thought about.
